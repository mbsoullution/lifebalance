seckit_xss:
  csp:
    checkbox: true
    vendor-prefix:
      x: false
      webkit: false
    report-only: false
    default-src: "'self' https://accounts.google.com https://www.facebook.com"
    script-src: "'self' https://www.googletagmanager.com"
    object-src: "'none'"
    style-src: "'self' 'unsafe-inline'"
    img-src: "'self' data: https://www.google-analytics.com https://www.googletagmanager.com"
    media-src: ''
    frame-src: "'self'"
    frame-ancestors: "'none'"
    child-src: ''
    font-src: "'self'"
    connect-src: "'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com"
    report-uri: ''
    upgrade-req: false
    policy-uri: ''
  x_xss:
    select: 0
seckit_csrf:
  origin: false
  origin_whitelist: ''
seckit_clickjacking:
  js_css_noscript: false
  noscript_message: 'Sorry, you need to enable JavaScript to visit this website.'
  x_frame: '2'
  x_frame_allow_from: ''
seckit_ssl:
  hsts: true
  hsts_subdomains: false
  hsts_max_age: 31536000
  hsts_preload: false
seckit_ct:
  expect_ct: false
  max_age: 86400
  report_uri: ''
  enforce: false
seckit_fp:
  feature_policy: false
  feature_policy_policy: ''
seckit_various:
  from_origin: false
  from_origin_destination: same
  referrer_policy: true
  referrer_policy_policy: strict-origin-when-cross-origin
  disable_autocomplete: false
