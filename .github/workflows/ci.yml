name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: phpcs, phpstan, phpunit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: mbstring, xml, curl, zip, gd, intl

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: phpcs and phpstan
        run: composer lint

      - name: phpunit
        run: composer test
